version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/hantabaru1014/dgl-desktop-hub/internal/pb
plugins:
  - local: protoc-gen-go
    out: internal/pb
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: internal/pb
    opt: paths=source_relative
