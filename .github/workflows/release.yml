name: Release

on:
  release:
    types: [published]
  # テスト実行用。リリースには添付せず Actions の artifact としてアップロードする
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: dgl-desktop-hub
  TAG: ${{ github.event.release.tag_name || 'dev' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha.98

      - name: Build for Windows (amd64)
        run: task windows:build

      - name: Archive Windows build
        run: |
          mkdir -p dist
          (cd bin && zip "../dist/${APP_NAME}-${TAG}-windows-amd64.zip" "${APP_NAME}.exe")

      # Linux ビルドは bin/dgl-desktop-hub に出力され、後続の darwin ビルドが
      # 同じパスを上書きするため、ビルドごとに即アーカイブする
      - name: Build for Linux (amd64)
        run: task linux:build

      - name: Archive Linux build
        run: tar -C bin -czf "dist/${APP_NAME}-${TAG}-linux-amd64.tar.gz" "${APP_NAME}"

      - name: Build cross-compilation Docker image
        run: task setup:docker

      - name: Build for macOS (universal)
        run: task darwin:package:universal

      - name: Archive macOS build
        run: (cd bin && zip -ry "../dist/${APP_NAME}-${TAG}-darwin-universal.zip" "${APP_NAME}.app")

      - name: Upload assets to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*

      - name: Upload artifacts (test run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/*
